# Security headers for the Bihar Heritage static site.
#
# Source of truth for response headers. Keep vercel.json (only used if the site is ever
# hosted on Vercel) and vite.config.js (`preview.headers`, for local testing) in sync with it.
#
# Install: copy to /etc/nginx/snippets/bihar-heritage-security.conf
#
# IMPORTANT: nginx drops every inherited add_header as soon as a block defines its own,
# so `include` this file inside EVERY location that calls add_header (see nginx.conf.example).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://maps.google.com https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), fullscreen=(self \"https://www.youtube.com\" \"https://www.youtube-nocookie.com\" \"https://maps.google.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
